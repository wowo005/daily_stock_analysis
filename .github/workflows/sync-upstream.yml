name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 12 * * 1'   # 每周一 UTC 12:00（北京时间 20:00）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync with upstream
        run: |
          # 直接从 GITHUB_REF 解析当前分支名，例如 refs/heads/main -> main
          DEFAULT_BRANCH="${GITHUB_REF#refs/heads/}"
          echo "当前分支: $DEFAULT_BRANCH"

          # 重新设置 upstream 远程地址，确保指向真实上游
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/ZhuLinsen/daily_stock_analysis.git

          # 拉取上游最新代码
          git fetch upstream

          # 切换到默认分支并做快进合并
          git checkout "$DEFAULT_BRANCH"
          git merge "upstream/$DEFAULT_BRANCH" --ff-only
          git push origin "$DEFAULT_BRANCH"
